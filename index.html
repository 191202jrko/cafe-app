<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>카페 판매 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--surface:#FFF;--surface2:#F0EDE6;--border:#E2DDD6;--border2:#CBC5BC;
  --text:#1A1714;--text2:#6B6560;--text3:#9C9690;
  --accent:#2D5A27;--accent-light:#EBF2EA;--accent-text:#1E3E1A;
  --danger:#8B2020;--danger-light:#F5EAEA;
  --warn-bg:#FDF3E3;--warn-border:#E8C97A;--warn-text:#7A5200;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --r:10px;--rl:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:var(--sans);color:var(--text);}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

.nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 10px;display:flex;align-items:stretch;position:sticky;top:0;z-index:50;}
.nav-tab{flex:1;padding:13px 0;font-size:13px;font-weight:500;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.lang-switcher{display:flex;align-items:center;gap:2px;padding:0 2px;flex-shrink:0;}
.lang-btn{padding:4px 6px;border-radius:6px;border:none;background:none;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;transition:background .15s,color .15s;}
.lang-btn.active{background:var(--accent-light);color:var(--accent-text);}

.page{flex:1;padding:16px;display:none;flex-direction:column;gap:12px;padding-bottom:100px;}
.page.active{display:flex;}

.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hcard-title{font-size:18px;font-weight:600;}
.hcard-sub{font-size:12px;color:var(--text3);margin-top:2px;font-family:var(--mono);}
.badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.badge-green{background:var(--accent-light);color:var(--accent-text);}
.badge-gray{background:var(--surface2);color:var(--text2);}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;}
.stat-label{font-size:11px;color:var(--text3);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;}
.stat-value{font-size:22px;font-weight:600;font-family:var(--mono);}
.stat-value.green{color:var(--accent);}

.today-log{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.tl-header{padding:10px 14px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.log-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:8px;}
.log-row:last-child{border-bottom:none;}
.log-time{font-family:var(--mono);font-size:12px;color:var(--text3);flex-shrink:0;width:46px;}
.log-items{flex:1;font-size:13px;color:var(--text2);line-height:1.4;}
.log-amt{font-family:var(--mono);font-size:13px;font-weight:500;flex-shrink:0;}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text3);flex-shrink:0;}
.icon-btn:active{background:var(--danger-light);color:var(--danger);border-color:var(--danger);}

.menu-list{display:flex;flex-direction:column;gap:6px;}
.menu-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s;}
.menu-item.has-qty{border-color:var(--accent);background:var(--accent-light);}
.menu-icon{width:38px;height:38px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.menu-item.has-qty .menu-icon{background:rgba(45,90,39,.12);}
.menu-info{flex:1;min-width:0;}
.menu-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.menu-price{font-size:12px;color:var(--text3);margin-top:1px;font-family:var(--mono);}
.menu-item.has-qty .menu-price{color:var(--accent-text);}
.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.qty-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;transition:background .1s,transform .1s;}
.qty-btn:active{background:var(--surface2);transform:scale(.94);}
.menu-item.has-qty .qty-btn{border-color:var(--accent);color:var(--accent-text);background:rgba(255,255,255,.7);}
.qty-num{font-size:16px;font-weight:600;min-width:24px;text-align:center;font-family:var(--mono);}

.bottom-bar{padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:40;}
.btn{flex:1;padding:14px;border-radius:var(--r);font-size:15px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s,transform .1s;font-family:var(--sans);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--surface2);color:var(--text2);flex:0 0 auto;padding:14px 16px;}
.btn-outline{background:none;border:1px solid var(--border2);color:var(--text2);}
.btn-excel{background:#1D6F42;color:#fff;}

.slabel{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:0 2px;}

.admin-sub-nav{display:flex;gap:4px;background:var(--surface2);border-radius:var(--r);padding:4px;}
.admin-sub-tab{flex:1;padding:8px 4px;border:none;background:none;border-radius:6px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;transition:background .15s,color .15s;}
.admin-sub-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.admin-sub-page{display:none;flex-direction:column;gap:12px;}
.admin-sub-page.active{display:flex;}

.admin-sheet-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.admin-row{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border);gap:8px;min-height:52px;}
.admin-row:last-child{border-bottom:none;}
.admin-row-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0;cursor:pointer;}
.a-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.admin-input{flex:1;border:none;background:none;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;padding:14px 0;}
.admin-input::placeholder{color:var(--text3);}
.price-input{width:80px;text-align:right;font-family:var(--mono);flex:0 0 80px;}
.admin-del{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--text3);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.admin-del:active{background:var(--danger-light);color:var(--danger);border-color:var(--danger);}
.add-btn{width:100%;padding:13px;border:1.5px dashed var(--border2);border-radius:var(--r);background:none;color:var(--text3);font-size:14px;font-family:var(--sans);cursor:pointer;}
.add-btn:active{color:var(--accent);border-color:var(--accent);}

.bulk-entry{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;overflow:hidden;}
.bulk-entry-header{display:flex;align-items:center;padding:10px 14px;gap:8px;}
.bulk-entry-time{font-family:var(--mono);font-size:12px;color:var(--text3);width:46px;flex-shrink:0;}
.bulk-entry-items{flex:1;font-size:13px;color:var(--text2);}
.bulk-entry-amt{font-family:var(--mono);font-size:13px;font-weight:500;flex-shrink:0;}

.date-range-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.date-range-row{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);gap:10px;}
.date-range-row:last-child{border-bottom:none;}
.date-range-label{font-size:13px;color:var(--text2);width:36px;flex-shrink:0;}
.date-range-input{flex:1;border:none;background:none;font-size:14px;font-family:var(--mono);color:var(--text);outline:none;padding:2px 0;}

.excel-preview{background:var(--accent-light);border:1px solid #A8D5B8;border-radius:var(--r);padding:14px;font-size:13px;color:var(--accent-text);line-height:1.9;}
.excel-preview b{font-weight:600;}

.report-filters{display:flex;gap:8px;}
.filter-select{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:13px;font-family:var(--sans);color:var(--text);outline:none;appearance:none;cursor:pointer;}
.filter-input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:13px;font-family:var(--mono);color:var(--text);outline:none;}
.filter-input:focus,.filter-select:focus{border-color:var(--accent);}
.report-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.report-table{width:100%;border-collapse:collapse;font-size:13px;}
.report-table th{padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;background:var(--surface2);border-bottom:1px solid var(--border);}
.report-table td{padding:10px 12px;border-bottom:1px solid var(--border);}
.report-table tr:last-child td{border-bottom:none;}
.report-table tr.sub td{background:var(--accent-light);font-weight:600;color:var(--accent-text);}
.tr{text-align:right;}
.mono{font-family:var(--mono);}
.chart-bar-wrap{display:flex;flex-direction:column;gap:8px;}
.chart-row{display:flex;align-items:center;gap:8px;font-size:13px;}
.chart-label{width:86px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);}
.chart-bar-bg{flex:1;height:22px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.chart-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .4s ease;}
.chart-val{width:52px;flex-shrink:0;text-align:right;font-family:var(--mono);font-size:12px;color:var(--text3);}

.setting-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
.setting-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:12px;}
.setting-row:last-child{border-bottom:none;}
.setting-label{flex:1;font-size:14px;font-weight:500;}
.setting-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.setting-input{flex:0 0 110px;border:none;border-bottom:1px solid var(--border2);background:none;font-size:14px;font-family:var(--mono);color:var(--text);outline:none;padding:4px 0;letter-spacing:2px;text-align:right;}
.setting-input:focus{border-bottom-color:var(--accent);}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-backdrop.hidden{display:none;}
.modal{background:var(--surface);border-radius:var(--rl) var(--rl) 0 0;width:100%;max-width:480px;padding:20px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:16px;}
.modal-menu-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.modal-menu-row:last-child{border-bottom:none;}
.modal-menu-name{flex:1;font-size:14px;}
.modal-qty-ctrl{display:flex;align-items:center;gap:8px;}
.modal-qty-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border2);background:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);}
.modal-qty-btn:active{background:var(--surface2);}
.modal-qty-num{font-size:15px;font-weight:600;min-width:22px;text-align:center;font-family:var(--mono);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}

.lock-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;}
.lock-screen.hidden{display:none;}
.lock-icon{font-size:40px;}
.lock-title{font-size:18px;font-weight:600;}
.lock-sub{font-size:13px;color:var(--text3);}
.lock-input{width:100%;max-width:280px;padding:14px;border:1px solid var(--border2);border-radius:var(--r);font-size:22px;text-align:center;font-family:var(--mono);letter-spacing:8px;outline:none;background:var(--surface);}
.lock-input:focus{border-color:var(--accent);}
.lock-btn{width:100%;max-width:280px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:500;cursor:pointer;font-family:var(--sans);}
.lock-err{font-size:13px;color:var(--danger);min-height:20px;}

.divider{height:1px;background:var(--border);}
.empty{text-align:center;padding:28px 16px;color:var(--text3);font-size:14px;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;z-index:500;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

<!-- LOCK -->
<div class="lock-screen" id="lock-screen">
  <div class="lock-icon">🔐</div>
  <div class="lock-title" id="lock-title">관리자 인증</div>
  <div class="lock-sub" id="lock-sub">관리자 비밀번호를 입력해주세요</div>
  <input class="lock-input" type="password" id="lock-input" maxlength="10" placeholder="••••"
    onkeydown="if(event.key==='Enter')checkPw()">
  <div class="lock-err" id="lock-err"></div>
  <button class="lock-btn" id="lock-btn" onclick="checkPw()">확인</button>
  <div style="font-size:12px;color:var(--text3);margin-top:4px;">기본 비밀번호: <span style="font-family:var(--mono);">1234</span></div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop hidden" id="edit-modal">
  <div class="modal">
    <div class="modal-title" id="modal-edit-title">판매 내역 수정</div>
    <div class="modal-sub" id="edit-modal-sub"></div>
    <div id="modal-menu-list"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="modal-cancel-btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveEdit()">수정 저장</button>
    </div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-tab active" id="nav-sales" onclick="switchTab('sales')">판매 입력</button>
  <button class="nav-tab" id="nav-reports" onclick="switchTab('reports')">판매 데이터</button>
  <button class="nav-tab" id="nav-admin" onclick="requireAdmin()">관리자</button>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('ko')">KO</button>
    <button class="lang-btn" onclick="setLang('th')">TH</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</nav>

<!-- SALES -->
<div class="page active" id="page-sales">
  <div class="hcard">
    <div>
      <div class="hcard-title" id="sales-title">오늘의 판매</div>
      <div class="hcard-sub" id="today-label">—</div>
    </div>
  </div>
  <div class="summary">
    <div class="stat"><div class="stat-label" id="stat-cups-label">오늘 누적 잔수</div><div class="stat-value" id="total-qty">0</div></div>
    <div class="stat"><div class="stat-label" id="stat-amt-label">오늘 누적 금액</div><div class="stat-value green" id="total-amt">₩0</div></div>
  </div>
  <div class="today-log" id="today-log-wrap" style="display:none;">
    <div class="tl-header">
      <span id="log-header-text">오늘 저장 내역</span>
      <span id="today-log-count" style="font-family:var(--mono);"></span>
    </div>
    <div id="today-log-list"></div>
  </div>
  <div class="slabel" id="menu-input-label">메뉴 입력</div>
  <div class="menu-list" id="menu-list"></div>
  <div style="flex:1"></div>
</div>

<!-- REPORTS -->
<div class="page" id="page-reports">
  <div class="hcard"><div><div class="hcard-title" id="reports-title">판매 데이터</div></div></div>
  <div class="report-filters">
    <select class="filter-select" id="report-mode" onchange="onModeChange()">
      <option value="day" id="opt-day">날짜별</option>
      <option value="month" id="opt-month">월별</option>
    </select>
    <input class="filter-input" type="date" id="report-date" onchange="renderReport()">
    <input class="filter-input" type="month" id="report-month" style="display:none;" onchange="renderReport()">
  </div>
  <div id="report-content"></div>
  <div style="flex:1"></div>
</div>

<!-- ADMIN -->
<div class="page" id="page-admin">
  <div class="admin-sub-nav">
    <button class="admin-sub-tab active" id="admin-tab-menus" onclick="switchAdminSub('menus')">메뉴</button>
    <button class="admin-sub-tab" id="admin-tab-bulk" onclick="switchAdminSub('bulk')">판매수정</button>
    <button class="admin-sub-tab" id="admin-tab-excel" onclick="switchAdminSub('excel')">엑셀다운</button>
    <button class="admin-sub-tab" id="admin-tab-settings" onclick="switchAdminSub('settings')">설정</button>
  </div>

  <!-- 메뉴 관리 -->
  <div class="admin-sub-page active" id="admin-menus">
    <div class="admin-sheet-wrap" id="admin-list"></div>
    <button class="add-btn" id="add-menu-btn" onclick="addMenu()">+ 메뉴 추가</button>
  </div>

  <!-- 판매 수정 -->
  <div class="admin-sub-page" id="admin-bulk">
    <input class="filter-input" type="date" id="bulk-date" onchange="renderBulk()" style="width:100%;">
    <div class="slabel" id="bulk-entries-label">건별 수정 · 삭제</div>
    <div id="bulk-entries"></div>
    <div class="slabel" id="bulk-total-label">날짜 합계 직접 입력</div>
    <div id="bulk-total-section"></div>
  </div>

  <!-- 엑셀 다운로드 -->
  <div class="admin-sub-page" id="admin-excel">
    <div class="slabel" id="excel-range-label">기간 선택</div>
    <div class="date-range-wrap">
      <div class="date-range-row">
        <span class="date-range-label" id="range-from-label">시작</span>
        <input class="date-range-input" type="date" id="excel-from" onchange="clearRangeBtns();updateExcelPreview()">
      </div>
      <div class="date-range-row">
        <span class="date-range-label" id="range-to-label">종료</span>
        <input class="date-range-input" type="date" id="excel-to" onchange="clearRangeBtns();updateExcelPreview()">
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn btn-outline" style="flex:0 0 auto;padding:8px 12px;font-size:12px;" id="range-today-btn" onclick="setExcelRange('today')">오늘</button>
      <button class="btn btn-outline" style="flex:0 0 auto;padding:8px 12px;font-size:12px;" id="range-week-btn" onclick="setExcelRange('week')">이번 주</button>
      <button class="btn btn-outline" style="flex:0 0 auto;padding:8px 12px;font-size:12px;" id="range-month-btn" onclick="setExcelRange('month')">이번 달</button>
      <button class="btn btn-outline" style="flex:0 0 auto;padding:8px 12px;font-size:12px;" id="range-all-btn" onclick="setExcelRange('all')">전체</button>
    </div>
    <div class="excel-preview" id="excel-preview">기간을 선택하면 다운로드할 데이터를 확인할 수 있어요.</div>
  </div>

  <!-- 설정 -->

function t(key,...args){
  const str=(I18N[curLang]||I18N.ko)[key]||(I18N.ko)[key]||key;
  return args.reduce((s,a)=>s.replace(/%[ds]/,a),str);
}

function setLang(lang){
  curLang=lang;

  document.documentElement.lang=lang==='th'?'th':lang==='en'?'en':'ko';
  document.documentElement.style.setProperty('--sans',
    lang==='th'?"'Noto Sans Thai',sans-serif":

    b.classList.toggle('active',b.textContent===lang.toUpperCase()));
  applyLang();
}

function p2(n){return String(n).padStart(2,'0');}
const _now=new Date();
const TODAY_KEY=`${_now.getFullYear()}-${p2(_now.getMonth()+1)}-${p2(_now.getDate())}`;
function dateLabel(d){const dt=new Date(d+'T00:00:00');const w=['일','월','화','수','목','금','토'][dt.getDay()];return `${dt.getFullYear()}.${p2(dt.getMonth()+1)}.${p2(dt.getDate())} (${w})`;}
function isoWeekStart(){const d=new Date(_now);d.setDate(d.getDate()-d.getDay());return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function isoMonthStart(){return `${_now.getFullYear()}-${p2(_now.getMonth()+1)}-01`;}
function isoAllStart(){return salesLog.length?[...salesLog].sort((a,b)=>a.date.localeCompare(b.date))[0].date:TODAY_KEY;}

/* ═══ LOCK ═══ */
function requireAdmin(){
  if(adminUnlocked){switchTab('admin');return;}
  document.getElementById('lock-screen').classList.remove('hidden');
  document.getElementById('lock-input').value='';
  document.getElementById('lock-err').textContent='';
  setTimeout(()=>document.getElementById('lock-input').focus(),100);
}
function checkPw(){
  const pw=localStorage.getItem('admin_pw')||'1234';
  if(document.getElementById('lock-input').value===pw){
    document.getElementById('lock-screen').classList.add('hidden');
    adminUnlocked=true;switchTab('admin');
  } else {
    document.getElementById('lock-err').textContent=t('toast_pw_wrong');
    document.getElementById('lock-input').value='';
    document.getElementById('lock-input').focus();
  }

function changePw(){
  const cur=document.getElementById('pw-current').value;
  const nw=document.getElementById('pw-new').value;
  const cnf=document.getElementById('pw-confirm').value;
  if(cur!==(localStorage.getItem('admin_pw')||'1234')){toast(t('toast_pw_wrong'));return;}
  if(!nw||nw.length<4){toast(t('toast_pw_short'));return;}
  if(nw!==cnf){toast(t('toast_pw_mismatch'));return;}
  localStorage.setItem('admin_pw',nw);

/* ═══ TABS ═══ */
function switchTab(tt){
  ['sales','reports','admin'].forEach((t2,i)=>{
    document.getElementById('nav-'+t2).classList.toggle('active',t2===tt);
    document.getElementById('page-'+t2).classList.toggle('active',t2===tt);
    if(t2==='admin')document.getElementById('nav-'+t2).classList.toggle('active',tt===tt&&tt==='admin');
  });
  document.querySelectorAll('.nav-tab').forEach((el,i)=>el.classList.toggle('active',['sales','reports','admin'][i]===tt));
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+tt).classList.add('active');
  document.getElementById('bar-sales').style.display=tt==='sales'?'flex':'none';
  document.getElementById('bar-reports').style.display=tt==='reports'?'flex':'none';
  ['menus','bulk','excel','settings'].forEach(s=>{
    const el=document.getElementById('bar-admin-'+s);
    if(el) el.style.display=(tt==='admin'&&s===curAdminSub)?'flex':'none';
  });
  if(tt==='admin'){renderAdmin();renderBulk();updateExcelPreview();}
  if(tt==='reports') renderReport();
}
function switchAdminSub(s){
  curAdminSub=s;
  document.querySelectorAll('.admin-sub-tab').forEach((el,i)=>
    el.classList.toggle('active',['menus','bulk','excel','settings'][i]===s));
  document.querySelectorAll('.admin-sub-page').forEach(el=>el.classList.remove('active'));
  document.getElementById('admin-'+s).classList.add('active');
  ['menus','bulk','excel','settings'].forEach(k=>{
    const el=document.getElementById('bar-admin-'+k);
    if(el) el.style.display=(k===s)?'flex':'none';
  });

  if(s==='bulk') renderBulk();
}

/* ═══ EXCEL DOWNLOAD ═══ */
function getExcelEntries(){
  const from=document.getElementById('excel-from').value;
  const to=document.getElementById('excel-to').value;
  if(!from||!to) return [];
  return salesLog.filter(s=>s.date>=from&&s.date<=to);
}
function setExcelRange(type){
  const toEl=document.getElementById('excel-to');
  const fromEl=document.getElementById('excel-from');
  if(type==='all'){
    // 전체: 저장된 데이터 중 가장 오래된 날짜 ~ 오늘
    fromEl.value=isoAllStart();
    toEl.value=TODAY_KEY;
  } else if(type==='today'){
    fromEl.value=TODAY_KEY;
    toEl.value=TODAY_KEY;
  } else if(type==='week'){
    fromEl.value=isoWeekStart();
    toEl.value=TODAY_KEY;
  } else if(type==='month'){
    fromEl.value=isoMonthStart();
    toEl.value=TODAY_KEY;
  }
  ['today','week','month','all'].forEach(k=>{
    const el=document.getElementById('range-'+k+'-btn');
    if(!el) return;
    el.style.background=(k===type)?'var(--accent-light)':'';
    el.style.color=(k===type)?'var(--accent-text)':'';
    el.style.borderColor=(k===type)?'var(--accent)':'';
  });
  updateExcelPreview();
}
function updateExcelPreview(){
  const entries=getExcelEntries();
  const from=document.getElementById('excel-from')?.value;
  const to=document.getElementById('excel-to')?.value;
  const el=document.getElementById('excel-preview');
  if(!el) return;
  if(!from||!to){el.innerHTML=t('excel_preview_default');return;}
  if(from>to){el.innerHTML='⚠️ 시작일이 종료일보다 늦어요.';return;}
  if(!entries.length){el.innerHTML=`<b>${from} ~ ${to}</b><br>${t('excel_no_data')}`;return;}
  const days=[...new Set(entries.map(s=>s.date))].length;
  const tq=entries.reduce((s,e)=>s+e.rows.reduce((a,r)=>a+r.qty,0),0);
  const ta=entries.reduce((s,e)=>s+e.total,0);
  el.innerHTML=t('excel_preview',from,to,days,entries.length,tq,ta.toLocaleString());
}
// 달력 직접 선택 시 빠른선택 버튼 활성화 해제
function clearRangeBtns(){
  ['today','week','month','all'].forEach(k=>{
    const el=document.getElementById('range-'+k+'-btn');
    if(!el) return;
    el.style.background=''; el.style.color=''; el.style.borderColor='';
  });
}
function downloadExcel(){
  const entries=getExcelEntries();
  if(!entries.length){toast(t('toast_no_data'));return;}
  const from=document.getElementById('excel-from').value;
  const to=document.getElementById('excel-to').value;
  const BOM='\uFEFF';
  const rows=[];

  // 헤더
  rows.push(['날짜','시간','메뉴명','단가','수량','금액'].join(','));

  // 상세 내역
  [...entries].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).forEach(e=>{
    const dt=new Date(e.ts);
    const time=p2(dt.getHours())+':'+p2(dt.getMinutes());
    e.rows.forEach(r=>{
      rows.push([e.date,time,'"'+r.name.replace(/"/g,'""')+'"',r.price,r.qty,r.amt].join(','));
    });
    rows.push([e.date,time,'"[소계]"','',e.rows.reduce((s,r)=>s+r.qty,0),e.total].join(','));
  });

  // 날짜별 합계
  rows.push('');
  rows.push(['"=== '+t('sheet_daily')+' ==="','','','','',''].join(','));
  rows.push(['"날짜"','"총 잔수"','"총 금액"','','',''].join(','));
  const byDate={};
  entries.forEach(e=>{
    if(!byDate[e.date]) byDate[e.date]={qty:0,amt:0};
    e.rows.forEach(r=>{byDate[e.date].qty+=r.qty;byDate[e.date].amt+=r.amt;});
  });
  Object.entries(byDate).sort().forEach(([d,v])=>{
    rows.push([d,v.qty,v.amt,'','',''].join(','));
  });

  // 메뉴별 합계
  rows.push('');
  rows.push(['"=== '+t('sheet_menu')+' ==="','','','','',''].join(','));
  rows.push(['"메뉴명"','"단가"','"총 수량"','"총 금액"','',''].join(','));
  const byMenu={};
  entries.forEach(e=>e.rows.forEach(r=>{
    if(!byMenu[r.name]) byMenu[r.name]={price:r.price,qty:0,amt:0};
    byMenu[r.name].qty+=r.qty;byMenu[r.name].amt+=r.amt;
  }));
  Object.entries(byMenu).sort((a,b)=>b[1].qty-a[1].qty).forEach(([name,v])=>{
    rows.push(['"'+name+'"',v.price,v.qty,v.amt,'',''].join(','));
  });

  const csv=BOM+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`카페판매_${from}_${to}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast(t('toast_dl')+` (${entries.length}${t('cases')})`);
}

    agg[r.name].qty+=r.qty;agg[r.name].amt+=r.amt;
  }));
  const items=Object.values(agg).sort((a,b)=>b.qty-a.qty);
  const tq=items.reduce((s,i)=>s+i.qty,0);

  }).join(''):'';
  content.innerHTML=`
    <div class="summary">
      <div class="stat"><div class="stat-label">${t('stat_cups')}</div><div class="stat-value">${tq}</div></div>
      <div class="stat"><div class="stat-label">${t('stat_amt')}</div><div class="stat-value green">₩${ta.toLocaleString()}</div></div>
    </div>
    <div class="chart-bar-wrap">${items.map(i=>`
      <div class="chart-row">
        <div class="chart-label">${i.name}</div>
        <div class="chart-bar-bg"><div class="chart-bar-fill" style="width:${Math.round(i.qty/mx*100)}%"></div></div>
        <div class="chart-val">${i.qty}${t('cups')}</div>
      </div>`).join('')}</div>
    <div class="report-table-wrap"><table class="report-table">
      <thead><tr><th>${t('th_menu')}</th><th class="tr">${t('th_qty')}</th><th class="tr">${t('th_amt')}</th></tr></thead>
      <tbody>
        ${items.map(i=>`<tr><td>${i.name}</td><td class="mono tr">${i.qty}${t('cups')}</td><td class="mono tr">₩${i.amt.toLocaleString()}</td></tr>`).join('')}
        <tr class="sub"><td>${t('total')}</td><td class="mono tr">${tq}${t('cups')}</td><td class="mono tr">₩${ta.toLocaleString()}</td></tr>
      </tbody></table></div>
    ${mode==='day'&&filtered.length?`
    <div class="slabel">${filtered.length}${t('cases')}</div>
    <div class="report-table-wrap"><table class="report-table">
      <thead><tr><th>${t('th_time')}</th><th>${t('th_detail')}</th><th class="tr">${t('th_amt')}</th></tr></thead>
      <tbody>${eRows}</tbody></table></div>`:''}`;
}

/* ═══ ADMIN MENUS ═══ */
const ICONS=['☕','🥛','🍦','🍮','🍵','🍓','🍫','🍋','🫖','🧋','🍰','🥐','🧁','🍩','🧃'];
function renderAdmin(){
  const list=document.getElementById('admin-list');
  if(!menus.length){list.innerHTML=`<div class="empty">${t('bulk_empty')}</div>`;return;}
  list.innerHTML=menus.map((m,i)=>`
    <div class="admin-row">
      <div class="admin-row-icon" onclick="cycleIcon(${i})">${m.icon||'☕'}</div>
      <div class="a-sep"></div>
      <input class="admin-input" type="text" value="${m.name}" placeholder="${t('th_menu')}" oninput="menus[${i}].name=this.value">
      <div class="a-sep"></div>
      <input class="admin-input price-input" type="number" value="${m.price}" placeholder="${t('th_price')}" oninput="menus[${i}].price=+this.value">
      <span style="font-size:12px;color:var(--text3);flex-shrink:0;">₩</span>
      <button class="admin-del" onclick="delMenu(${i})">×</button>
    </div>`).join('');
}
function cycleIcon(i){const c=ICONS.indexOf(menus[i].icon||'☕');menus[i].icon=ICONS[(c+1)%ICONS.length];renderAdmin();}
function addMenu(){menus.push({name:'',price:0,icon:'☕'});renderAdmin();const rows=document.querySelectorAll('.admin-row');if(rows.length)rows[rows.length-1].querySelector('input').focus();}
function delMenu(i){if(confirm(t('confirm_delete_menu',menus[i].name))){menus.splice(i,1);qty=menus.map(()=>0);renderAdmin();}}
function saveMenus(){
  for(let m of menus){if(!m.name.trim()){toast(t('toast_menu_required'));return;}}
  localStorage.setItem('cafe_menus',JSON.stringify(menus));
  qty=menus.map(()=>0);renderSales();toast(t('toast_menu_saved'));
}

/* ═══ DATA ═══ */
function persist(){localStorage.setItem('cafe_sales',JSON.stringify(salesLog));}
function exportData(){
  const blob=new Blob([JSON.stringify({menus,salesLog},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
  const d=new Date();a.download=`cafe-backup-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`;
  a.click();URL.revokeObjectURL(url);toast(t('toast_export'));
}
function clearAllData(){
  if(!confirm(t('confirm_clear1'))) return;
  if(!confirm(t('confirm_clear2'))) return;
  salesLog=[];persist();renderSales();renderBulk();renderReport();toast(t('toast_all_deleted'));
}

/* ═══ TOAST ═══ */
let _tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2500);
}
</script>
</body>
</html>
